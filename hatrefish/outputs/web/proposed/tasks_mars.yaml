- id: R1
  mission: mars
  name: 著陸地表條件
  name_en: Landing surface conditions
  verify: 坡度、岩石、承重是否適合降落
  nasa_basis: SkyFall 工程限制 V.e–g
  nasa_url: https://science.nasa.gov/mission/skyfall/
  tech_gap:
    rank: 10
    bin: 2
    label: 10（2）、37（5）
  order: 1
  manual_adjust: null
  notes:
  - 以當地時間與太陽經度 Ls 對齊；火星年約 687 地球日。
  - 地形使用 Copernicus DEM；所有示範數值均非觀測。
  - SkyFall 五區缺少著陸器實測；工程限制及技術缺口排名沿用團隊規格，待查原文。
  features:
  - id: r1_slope_100m
    name: 100 m 坡度
    name_en: 100 m slope
    type: threshold
    compare_mode: absolute
    unit: deg
    weight: 1.0
    threshold:
      ideal_max: 5
      zero_at: 15
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: HRSC＋MOLA 200 m 坡度
      official: false
      source_id: hrsc_mola
      url: null
    earth_data:
    - name: GMTED2010 230 m 坡度（0.1° 格內中位數）
      official: false
      source_id: gmted
      url: null
    notes:
    - '`{ideal_max: 5, zero_at: 15}`（待定）'
    - 本隊資料是 200 m 尺度，不是 100 m。
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_slope_1_5m
    name: 1–5 m 坡度
    name_en: 1–5 m slope
    type: threshold
    compare_mode: absolute
    unit: deg
    weight: 1.0
    threshold:
      ideal_max: 12
      zero_at: 15
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: true
    planet_data:
    - name: HiRISE 地形模型 （覆蓋有限）
      official: true
      source_id: pds
      url: https://pds.nasa.gov/
    earth_data:
    - name: 無全球資料，用 30 m 坡度 + 雷達代理
      official: true
      source_id: earthdata
      url: https://search.earthdata.nasa.gov/
    notes:
    - '`{ideal_max: 12, zero_at: 15}`；earth_proxy'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_rock
    name: 岩石覆蓋率
    name_en: Rock fraction
    type: threshold
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold:
      max: 0.05
    out_of_earth_range: false
    earth_proxy: true
    planet_data:
    - name: TES／THEMIS 岩石覆蓋
      official: true
      source_id: pds
      url: https://pds.nasa.gov/
    earth_data:
    - name: 表觀熱慣量 + Sentinel-1／PALSAR
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - 'planet_threshold `{max: 0.05}`；earth_proxy'
    - 跨星球不同單位：只比百分位，行星門檻不套用於地球分數。
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_thermal_inertia
    name: 熱慣量
    name_en: Thermal inertia
    type: threshold
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold:
      zero_at: 100
      ideal_min: 150
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: TES 夜間熱慣量（Putzig & Mellon 2007）
      official: true
      source_id: tes
      url: null
    earth_data:
    - name: MODIS 表觀熱慣量 ATI =（1 − 反照率）／ 日夜溫差
      official: true
      source_id: earthdata
      url: null
    notes:
    - 'planet_threshold `{zero_at: 100, ideal_min: 150}`；地球單位不同只比相對排名'
    - 跨星球不同單位：只比百分位，行星門檻不套用於地球分數。
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_barren
    name: 無植被
    name_en: Bare ground
    type: threshold
    compare_mode: absolute
    unit: NDVI
    weight: 1.0
    threshold:
      ideal_max: 0.0
      zero_at: 0.3
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data: []
    earth_data:
    - name: MODIS NDVI 2015–2024
      official: true
      source_id: earthdata
      url: null
    notes:
    - NDVI ≤ 0 得 1、≥ 0.3 得 0；南緯 60° 以南沒有 NDVI，補 0（無植被）。
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_ice_free
    name: 不是冰面
    name_en: Ice-free surface
    type: threshold
    compare_mode: absolute
    unit: fraction
    weight: 1.0
    threshold:
      ideal_max: 0.1
      zero_at: 0.5
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data: []
    earth_data:
    - name: MCD12Q1 冰雪比例；年均 NDVI < 0 且年均溫 < 0 °C
      official: true
      source_id: earthdata
      url: null
    notes:
    - 降落面是岩石與風化層，不是冰：冰雪比例 ≤ 0.1 得 1、≥ 0.5 得 0。
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
