# 任務 B（地球端＋權重學習）用的環境。
# 建立：conda env create -f env/nasa_hackathon.yml
# 啟用：conda activate nasa_hackathon
# 和 environment.yml（analog）相同的地理空間套件，另外加上權重學習／交叉驗證用的 xgboost、shap。
name: nasa_hackathon
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # 地理空間
  - gdal
  - libgdal-netcdf
  - rasterio
  - rioxarray
  - xarray
  - netcdf4
  - geopandas
  - pyogrio
  - shapely
  - pyproj
  # 數值與機器學習
  - numpy
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - xgboost          # 交叉驗證用的樹模型（Random Forest 之外的第二個對照）
  - shap             # 樹模型的特徵貢獻解釋
  # 資料存取
  - earthengine-api
  - requests
  - tqdm
  # 工具
  - pyyaml
  - matplotlib
  - ipykernel
  - pytest
  - pip
