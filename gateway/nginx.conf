server {
  listen 80;
  location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
  location /api/catalog/ { proxy_pass http://catalog:8000/; proxy_set_header Host $host; }
  location /api/measurements/ { proxy_pass http://measurements:8000/; proxy_set_header Host $host; }
  location /api/planning/ { proxy_pass http://planning:8000/; proxy_set_header Host $host; proxy_read_timeout 120s; }
  location = /api/similarity/optimize { proxy_pass http://planning:8000/optimize; proxy_read_timeout 120s; }
  location = /api/similarity/sensitivity { proxy_pass http://planning:8000/sensitivity; proxy_read_timeout 120s; }
  location /api/similarity/ { proxy_pass http://similarity:8000/; proxy_set_header Host $host; proxy_read_timeout 120s; }
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
