- id: M1
  mission: moon
  name: 精準安全降落
  name_en: Precision landing
  verify: 在岩塊、坑洞、陰影中辨識安全著陸點
  nasa_basis: User's Guide「Landing Safely and Accurately」
  nasa_url: https://www.nasa.gov/moonbase-phases/
  tech_gap:
    rank: 27
    bin: 3
    label: 27（3）
  order: 6
  manual_adjust: null
  notes:
  - 當地太陽時相位對齊；月球太陽日約 29.5 地球日。
  - 地形使用 Copernicus DEM；所有示範數值均非觀測。
  - 坡度與岩石門檻待補文獻，目前採剖面比對。
  features:
  - id: m1_slope
    name: 多尺度坡度、粗糙度
    name_en: Multiscale slope
    type: profile
    compare_mode: absolute
    unit: deg
    weight: 1.0
    threshold: null
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: LOLA
      official: true
      source_id: lro
      url: https://science.nasa.gov/mission/lro/
    earth_data:
    - name: Copernicus DEM
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - 門檻待補文獻
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: m1_rock_proxy
    name: 岩塊覆蓋（代理）
    name_en: Rock coverage proxy
    type: profile
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: true
    planet_data:
    - name: Diviner 岩石覆蓋率
      official: true
      source_id: diviner
      url: https://pds-geosciences.wustl.edu/missions/lro/diviner.htm
    earth_data:
    - name: 表觀熱慣量（MODIS 推算）
      official: true
      source_id: earthdata
      url: https://search.earthdata.nasa.gov/
    notes:
    - earth_proxy
    - 跨星球不同單位：只比百分位，行星門檻不套用於地球分數。
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: m1_radar_rough
    name: 公分級雷達粗糙度
    name_en: Radar roughness
    type: profile
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: Mini-RF
      official: true
      source_id: lro
      url: https://science.nasa.gov/mission/lro/
    earth_data:
    - name: Sentinel-1、PALSAR
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - 波段不同，只比相對排名
    - 跨星球不同單位：只比百分位，行星門檻不套用於地球分數。
