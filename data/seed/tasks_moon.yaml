- id: M1
  mission: moon
  name: Precision landing
  name_en: Precision landing
  verify: Identify safe landing areas among rocks, craters, and shadows
  nasa_basis: User's Guide - Landing Safely and Accurately
  nasa_url: https://www.nasa.gov/moonbase-phases/
  tech_gap:
    rank: 27
    bin: 3
    label: 27 (3)
  order: 6
  manual_adjust: null
  notes:
  - Align local solar phase; a lunar solar day is about 29.5 Earth days.
  - Use Copernicus DEM for terrain. All demo values are synthetic, not observations.
  - Quantitative slope and rock thresholds need literature review; use profile comparisons
    for now.
  features:
  - id: m1_slope
    name: Multiscale slope
    name_en: Multiscale slope
    type: profile
    compare_mode: absolute
    unit: deg
    weight: 1.0
    threshold: null
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: LOLA
      official: true
      source_id: lro
      url: https://science.nasa.gov/mission/lro/
    earth_data:
    - name: Copernicus DEM
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - Threshold literature pending
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: m1_rock_proxy
    name: Rock coverage proxy
    name_en: Rock coverage proxy
    type: profile
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: true
    planet_data:
    - name: Diviner rock abundance
      official: true
      source_id: diviner
      url: https://pds-geosciences.wustl.edu/missions/lro/diviner.htm
    earth_data:
    - name: Apparent thermal inertia from MODIS
      official: true
      source_id: earthdata
      url: https://search.earthdata.nasa.gov/
    notes:
    - earth_proxy
    - 'Cross-planet units differ: compare percentiles only; planetary thresholds do
      not score Earth candidates.'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: m1_radar_rough
    name: Radar roughness
    name_en: Radar roughness
    type: profile
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: Mini-RF
      official: true
      source_id: lro
      url: https://science.nasa.gov/mission/lro/
    earth_data:
    - name: Sentinel-1 and PALSAR
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - Different bands; compare relative ranks only
    - 'Cross-planet units differ: compare percentiles only; planetary thresholds do
      not score Earth candidates.'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
