- id: R1
  mission: mars
  name: Landing surface conditions
  name_en: Landing surface conditions
  verify: Evaluate slope, rocks, and bearing conditions for landing
  nasa_basis: SkyFall engineering constraints V.e-g
  nasa_url: https://science.nasa.gov/mission/skyfall/
  tech_gap:
    rank: 10
    bin: 2
    label: 10 (2), 37 (5)
  order: 1
  manual_adjust: null
  notes:
  - Align local time and solar longitude Ls; a Martian year is about 687 Earth days.
  - Mission comparisons use traceable observations and data-derived models. Missing evidence has no synthetic fallback.
  - The five SkyFall regions lack lander measurements. Engineering constraints and gap ranks follow the team brief
    and require source review.
  features:
  - id: r1_slope_100m
    name: 100 m slope
    name_en: 100 m slope
    type: threshold
    compare_mode: absolute
    unit: deg
    weight: 1.0
    threshold:
      ideal_max: 5
      zero_at: 15
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: CTX or HRSC terrain  (MOLA at approximately 463 m is too coarse)
      official: false
      source_id: ctx
      url: https://murray-lab.caltech.edu/CTX/
    earth_data:
    - name: Copernicus DEM
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - '`{ideal_max: 5, zero_at: 15}` (provisional)'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_slope_1_5m
    name: 1-5 m slope
    name_en: 1–5 m slope
    type: threshold
    compare_mode: absolute
    unit: deg
    weight: 1.0
    threshold:
      ideal_max: 12
      zero_at: 15
    planet_threshold: null
    out_of_earth_range: false
    earth_proxy: true
    planet_data:
    - name: HiRISE terrain models  (limited coverage)
      official: true
      source_id: pds
      url: https://pds.nasa.gov/
    earth_data:
    - name: No global data
      official: true
      source_id: earthdata
      url: https://search.earthdata.nasa.gov/
    - name: use 30 m slope and radar proxies
      official: true
      source_id: earthdata
      url: https://search.earthdata.nasa.gov/
    notes:
    - '`{ideal_max: 12, zero_at: 15}`; earth_proxy'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_rock
    name: Rock fraction
    name_en: Rock fraction
    type: threshold
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold:
      max: 0.05
    out_of_earth_range: false
    earth_proxy: true
    planet_data:
    - name: TES/THEMIS rock abundance
      official: true
      source_id: pds
      url: https://pds.nasa.gov/
    earth_data:
    - name: Apparent thermal inertia + Sentinel-1/PALSAR
      official: true
      source_id: copernicus
      url: https://dataspace.copernicus.eu/
    notes:
    - 'planet_threshold `{max: 0.05}`; earth_proxy'
    - 'Cross-planet units differ: compare percentiles only; planetary thresholds do not score Earth candidates.'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
  - id: r1_thermal_inertia
    name: Thermal inertia
    name_en: Thermal inertia
    type: threshold
    compare_mode: relative_rank
    unit: ''
    weight: 1.0
    threshold: null
    planet_threshold:
      zero_at: 100
      ideal_min: 150
    out_of_earth_range: false
    earth_proxy: false
    planet_data:
    - name: THEMIS thermal inertia (approximately 100 m)
      official: true
      source_id: pds
      url: https://pds.nasa.gov/
    earth_data:
    - name: Apparent thermal inertia
      official: true
      source_id: earthdata
      url: https://search.earthdata.nasa.gov/
    notes:
    - 'planet_threshold `{zero_at: 100, ideal_min: 150}`; Earth units differ, so compare relative ranks'
    - 'Cross-planet units differ: compare percentiles only; planetary thresholds do not score Earth candidates.'
    stat: mean
    stat_threshold: 0
    rank_stat_threshold: null
