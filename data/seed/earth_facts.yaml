source:
  title: NASA Planetary Fact Sheet
  url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/
notes: Day length is the solar day, not sidereal rotation. Lunar shadow temperatures
  are local extremes, not global averages.
rows:
- name: Surface gravity
  name_en: Surface gravity
  earth: 1 g
  moon: 0.166 g
  mars: 0.38 g
- name: Solar day
  name_en: Solar day
  earth: 24 h
  moon: 29.5 Earth days
  mars: 24 h 39 min
- name: Surface pressure
  name_en: Surface pressure
  earth: 1013 hPa
  moon: ≈ 0 hPa
  mars: ≈ 6 hPa
- name: Surface temperature
  name_en: Surface temperature
  earth: ≈ 15°C
  moon: < −230°C / > 100°C
  mars: ≈ −60°C
- name: Global intrinsic magnetic field
  name_en: Global intrinsic magnetic field
  earth: 'Yes'
  moon: 'No'
  mars: 'No'
