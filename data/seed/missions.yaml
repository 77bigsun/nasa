- id: moon
  name: 'Moon: Permanent Base Candidates'
  name_en: 'Moon: Permanent Base Candidates'
  goal: Find a compact network of Earth sites for six lunar south-polar base tests.
  goal_en: Find a compact network of Earth sites for six lunar south-polar base tests.
  summary: South-polar illumination, long darkness, and cold-trap resources create
    linked engineering tests. The 5 kW and 120-hour targets and gap ordering follow
    the team brief and require original-source review.
  summary_en: South-polar illumination, long darkness, and cold-trap resources create
    linked engineering tests. The 5 kW and 120-hour targets and gap ordering follow
    the team brief and require original-source review.
  nasa_sources:
  - title: Moon Base User's Guide
    url: https://www.nasa.gov/moonbase-phases/
  - title: Moon to Mars Architecture
    url: https://www.nasa.gov/moontomarsarchitecture/
- id: mars
  name: 'Mars: Landing & Exploration'
  name_en: 'Mars: Landing & Exploration'
  goal: Connect landing, navigation, and subsurface ice requirements to complementary
    Earth sites.
  goal_en: Connect landing, navigation, and subsurface ice requirements to complementary
    Earth sites.
  summary: SkyFall links three-helicopter exploration to geology, climate, and subsurface
    ice. AP-105 coordinates and engineering constraints are team-supplied design cases,
    not a confirmed landing selection.
  summary_en: SkyFall links three-helicopter exploration to geology, climate, and
    subsurface ice. AP-105 coordinates and engineering constraints are team-supplied
    design cases, not a confirmed landing selection.
  nasa_sources:
  - title: NASA SkyFall
    url: https://science.nasa.gov/mission/skyfall/
  - title: SR-1 Freedom
    url: https://www.nasa.gov/mission/space-reactor-1-freedom/
