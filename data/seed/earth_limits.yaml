moon:
- condition: Gravity
  planet: One sixth of Earth gravity
  reproducible: 'No'
  handling: List as not reproducible
- condition: Atmosphere
  planet: Nearly vacuum, without wind or weather
  reproducible: 'No'
  handling: List as not reproducible
- condition: Temperature
  planet: Shadows below -230 C; sunlit terrain above 100 C
  reproducible: No for absolute values
  handling: Compare relative features only
- condition: Illumination
  planet: Low Sun near the horizon and long shadows
  reproducible: Partly at high latitudes
  handling: Include in M2
- condition: Lunar dust
  planet: Sharp, electrostatic, and unweathered
  reproducible: Partly with volcanic fragments
  handling: Include in M5; electrostatics cannot be reproduced
- condition: Radiation
  planet: No global field or atmospheric protection
  reproducible: 'No'
  handling: List as not reproducible
- condition: Geology
  planet: No water or biological weathering
  reproducible: Partly
  handling: Explain in site descriptions
mars:
- condition: Atmosphere
  planet: Below 1% of Earth's pressure, mostly CO2
  reproducible: 'No'
  handling: List as not reproducible
- condition: Landing elevation
  planet: Below -3 km
  reproducible: Not applicable
  handling: Do not score; explain in site descriptions
- condition: Gravity
  planet: Approximately 38% of Earth's gravity
  reproducible: 'No'
  handling: List as not reproducible
- condition: Radiation
  planet: No global field and a thin atmosphere; relevant to SkyFall dosimetry
  reproducible: 'No'
  handling: List as not reproducible
- condition: Temperature
  planet: Mean about -60 C with large diurnal range
  reproducible: Partly in polar or alpine areas
  handling: Compare relative features
- condition: Water
  planet: No surface liquid water; ice and hydrated minerals
  reproducible: Partly in hyperarid deserts and permafrost
  handling: Include in R3 and R4
- condition: Soil chemistry
  planet: Perchlorates and other oxidants
  reproducible: Partly
  handling: Explain in site descriptions
- condition: Dust
  planet: Global dust storms
  reproducible: Partly; scale and mechanisms differ
  handling: Include in R6
- condition: Geology
  planet: Volcanic, cratered, fluvial, and periglacial landforms
  reproducible: 'Yes'
  handling: A rich source of terrestrial analog processes
