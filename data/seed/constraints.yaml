moon: []
mars:
- condition: Latitude
  requirement: Equator to 45 N
  earth_analog: Not applicable
- condition: Elevation
  requirement: Below -3 km relative to MOLA datum
  earth_analog: Not applicable
- condition: 100 m slope
  requirement: Below 5-15 degrees (provisional)
  earth_analog: Yes, R1
- condition: 1-5 m slope
  requirement: Below 15 degrees
  earth_analog: Yes, R1
- condition: Rocks
  requirement: Height below 11 cm and coverage below 5%
  earth_analog: Yes, R1, using an Earth proxy
- condition: Thermal inertia
  requirement: Above 100, preferably above 150 J m^-2 K^-1 s^-1/2
  earth_analog: Relative ranks only, R1
- condition: Surface texture
  requirement: Navigation landmarks; avoid extensive dunes and sand sheets
  earth_analog: Yes, R2
- condition: Season
  requirement: Northern spring arrival
  earth_analog: Context for R6
